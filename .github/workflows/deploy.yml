name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos para publicar en Pages con OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llegan dos pushes seguidos, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No se publica nada que no pase los tests del núcleo geométrico.
      - run: npm test

      - run: npm run build

      # `enablement` activa Pages en el repositorio la primera vez, para no
      # tener que ir a los ajustes a mano.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
